<title>국가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 대통령 집무실 책상 — 왼쪽은 나라 상황판(지표·세력·기반), 오른쪽은 결재 서류 한 장. 서류에는 보라색 고무도장이 찍힌다. */
:root{
  --paper:#E5E9E2; --sheet:#F7F8F4; --ink:#1B2420; --muted:#5A655F; --rule:#C3CCC4;
  --stamp:#5B3E91; --alarm:#A4352A; --good:#2E6A4E; --warn:#94650F; --wash:#DCE2DA;
  --display:'Hahmlet','Noto Serif KR','Nanum Myeongjo',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'Nanum Gothic Coding','D2Coding',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111715; --sheet:#1A221F; --ink:#E1E6DF; --muted:#97A29B; --rule:#2E3A35;
    --stamp:#B39BEA; --alarm:#E7745F; --good:#73C49B; --warn:#D9AE55; --wash:#222C28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111715; --sheet:#1A221F; --ink:#E1E6DF; --muted:#97A29B; --rule:#2E3A35;
  --stamp:#B39BEA; --alarm:#E7745F; --good:#73C49B; --warn:#D9AE55; --wash:#222C28; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;}
#app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:800}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:10px 18px;font-family:var(--display);font-weight:600;font-size:15px;border-radius:2px}
.btn:hover{background:var(--stamp);border-color:var(--stamp)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{border-color:var(--stamp);color:var(--stamp);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ── header bar ── */
.bar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.bar .seal-title{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em}
.bar .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.bar .meta b{color:var(--ink);font-weight:700}

/* ── desk grid ── */
.desk{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-areas:"vitals main" "ledger main";gap:18px 26px;align-items:start}
.vitals{grid-area:vitals;display:grid;gap:16px}
.ledger{grid-area:ledger;display:grid;gap:16px}
.main{grid-area:main;display:grid;gap:12px;min-width:0}
@media (max-width:860px){
  .desk{grid-template-columns:minmax(0,1fr);grid-template-areas:"vitals" "main" "ledger"}
}
.panel h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;font-weight:700;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:8px}

/* indicators */
.inds{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.ind .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.ind .num{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.ind .num .q{color:var(--warn);margin-left:2px}
.ind .track{height:7px;background:var(--wash);border:1px solid var(--rule);position:relative}
.ind .track i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .5s ease}
.ind.danger .track i{background:var(--alarm)}
.ind.danger .num{color:var(--alarm)}
.ind.fog .track i{background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 6px)}
.ind .why{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* factions */
.facs{display:grid;grid-template-columns:1fr 1fr;gap:6px;list-style:none;margin:0;padding:0}
.fac{display:grid;grid-template-columns:28px 1fr auto;gap:2px 8px;align-items:center;padding:5px 6px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px}
.fac .sg{grid-row:span 2;width:28px;height:28px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;border:1.5px solid currentColor;border-radius:2px}
.fac .nm{font-size:13px;font-weight:500}
.fac .sw{font-family:var(--display);font-weight:800;font-size:13px;text-align:right}
.fac .pips{grid-column:2 / span 2;display:flex;gap:3px}
.fac .pips i{flex:1;height:3px;background:var(--wash)}
.fac .pips i.on{background:currentColor}
.s-적대{color:var(--alarm)} .s-불만{color:var(--warn)} .s-관망{color:var(--muted)} .s-호의{color:var(--good)} .s-열광{color:var(--stamp)}
.fac .nm{color:var(--ink)}

/* stage & bases */
.stage-line{font-family:var(--display);font-size:18px;font-weight:800}
.stage-steps{display:flex;gap:4px;margin:6px 0 4px}
.stage-steps span{flex:1;font-family:var(--mono);font-size:11px;text-align:center;padding:3px 0;border:1px solid var(--rule);color:var(--muted)}
.stage-steps span.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.stage-steps span.done{color:var(--ink)}
.next-req{font-size:12px;color:var(--muted)}
.bases{display:grid;gap:4px;list-style:none;margin:8px 0 0;padding:0}
.bases li{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px dotted var(--rule);padding-bottom:3px}
.bases li .own{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
.bases li.prog{color:var(--muted)}
.bases .cat{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-right:6px}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.flags span{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);padding:1px 6px;color:var(--muted)}
.prez{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.prez li{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;font-size:13px}
.prez li .t{font-family:var(--display);font-weight:600}
.prez li .s{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

/* wire (headline band) */
.wire{border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);padding:6px 0;display:grid;gap:3px;min-height:34px}
.wire p{margin:0;font-size:13.5px;display:flex;gap:10px}
.wire p .d{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;padding-top:2px}
.wire p:first-child{font-weight:600}
.wire p:not(:first-child){color:var(--muted)}
.wire .empty{color:var(--muted);font-size:13px}

/* memo (card) */
.memo{background:var(--sheet);border:1px solid var(--rule);box-shadow:0 1px 0 var(--rule),0 10px 30px -18px rgba(0,0,0,.35);padding:20px 22px 22px;position:relative;border-radius:2px;animation:slidein .35s ease both}
@keyframes slidein{from{transform:translateY(8px);opacity:.35}to{transform:none;opacity:1}}
.memo-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px dashed var(--rule);padding-bottom:8px;margin-bottom:12px}
.stamp{display:inline-block;font-family:var(--display);font-weight:800;color:var(--stamp);border:2px solid var(--stamp);padding:1px 10px;transform:rotate(-3deg);letter-spacing:.12em;font-size:13px;border-radius:3px}
.memo h2{font-size:clamp(24px,4vw,32px);letter-spacing:-.01em;margin-bottom:10px}
.sit{margin:0 0 14px;font-size:14px;color:var(--muted);border-left:2px solid var(--rule);padding-left:10px}
.sit b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);margin-right:6px;font-weight:700}
.speaker{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.speaker .sg{flex:none;width:42px;height:42px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:21px;border:2px solid var(--ink);border-radius:2px}
.speaker .who{font-size:13px}
.speaker .who b{font-family:var(--display);font-size:15px}
.speaker .who i{color:var(--muted);font-style:normal}
.speaker blockquote{margin:4px 0 0;font-family:var(--display);font-size:clamp(17px,2.4vw,20px);line-height:1.55;font-weight:600}
.rec{margin:12px 0 0;font-family:var(--mono);font-size:12px;color:var(--warn);display:grid;gap:2px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;padding:12px 14px;display:grid;gap:8px;transition:transform .12s ease,border-color .12s}
.opt:hover{border-color:var(--stamp);transform:translateY(-2px)}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--muted)}
.opt .lab{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.35}
.fxs{display:flex;flex-wrap:wrap;gap:4px}
.fx{font-family:var(--mono);font-size:11.5px;padding:1px 6px;border:1px solid var(--rule);background:var(--sheet);white-space:nowrap}
.fx.g{color:var(--good)} .fx.b{color:var(--alarm)}
.fx.base{color:var(--stamp);border-color:var(--stamp)}
.fx.pr{color:var(--sheet);background:var(--alarm);border-color:var(--alarm)}
.fx.el{color:var(--ink)}

/* result */
.result .chosen{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.big-stamp{font-family:var(--display);font-weight:800;font-size:28px;color:var(--stamp);border:3px double var(--stamp);padding:2px 12px;transform:rotate(-6deg);border-radius:4px;animation:slam .35s cubic-bezier(.2,1.6,.4,1) both;letter-spacing:.1em}
@keyframes slam{from{transform:rotate(-6deg) scale(1.6);opacity:.2}to{transform:rotate(-6deg) scale(1);opacity:1}}
.result .chosen .lab{font-family:var(--display);font-weight:800;font-size:18px}
.result .txt{font-family:var(--display);font-size:clamp(18px,2.6vw,22px);line-height:1.6;font-weight:600;margin:4px 0 16px}
.changes{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0 0 12px;padding:0}
.changes li{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);padding:2px 8px;background:var(--paper)}
.changes li.g b{color:var(--good)} .changes li.b b{color:var(--alarm)}
.heads{border-top:1px solid var(--rule);padding-top:8px;display:grid;gap:4px}
.heads p{margin:0;font-size:14px}
.heads p::before{content:"■ ";color:var(--stamp)}
.ext{font-family:var(--mono);font-size:12px;color:var(--alarm);margin:0 0 8px}
.collapse-note{border:2px solid var(--alarm);color:var(--alarm);padding:10px 12px;margin:12px 0 0;font-family:var(--display);font-weight:800}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px}

/* screens */
.screen{max-width:760px;margin:0 auto;display:grid;gap:18px}
.title-hero{padding-block:48px 8px;display:grid;gap:14px}
.title-hero .hanja{font-family:var(--display);font-weight:800;font-size:clamp(72px,16vw,132px);line-height:1;letter-spacing:.04em}
.title-hero .ko{font-family:var(--mono);letter-spacing:.4em;color:var(--muted)}
.title-hero .thesis{font-family:var(--display);font-size:clamp(20px,3.4vw,26px);font-weight:600}
.howto{display:grid;gap:6px;padding:0;margin:0;list-style:none;border-top:1px solid var(--rule);padding-top:12px}
.howto li{font-size:14px;display:grid;grid-template-columns:22px 1fr}
.howto li::before{content:"—";color:var(--muted)}
.build-note{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--rule);padding:20px 22px;border-radius:2px}
.field{display:grid;gap:6px}
.field input[type=text]{font:inherit;font-family:var(--display);font-size:22px;font-weight:600;padding:8px 10px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:2px;width:100%;box-sizing:border-box}
.gender{display:flex;gap:8px}
.gender label{border:1.5px solid var(--rule);padding:6px 14px;cursor:pointer;border-radius:2px}
.gender input{position:absolute;opacity:0;pointer-events:none}
.gender input:checked + span{color:var(--stamp);font-weight:700}
.gender label:has(input:checked){border-color:var(--stamp)}
.notice{border-left:3px solid var(--stamp);padding:4px 0 4px 12px;display:grid;gap:4px}
.notice b{font-family:var(--display)}
.notice ul{margin:0;padding-left:18px;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:5px 0;border-bottom:1px dotted var(--rule)}
.tbl td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl tr.sum td{border-top:1.5px solid var(--ink);border-bottom:none;font-weight:700;padding-top:8px}

/* legacy & gallery */
.legacy{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:560px){.legacy{grid-template-columns:minmax(0,1fr)}}
.legacy .portrait{width:120px;height:150px}
.ttl-main{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.6vw,36px);color:var(--stamp)}
.ttl-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ttl-sub span{font-size:12.5px;border:1px solid var(--rule);padding:1px 8px}
.ttl-sub span b{font-family:var(--mono);font-weight:400;color:var(--muted);margin-right:4px;font-size:11px}
.memgrid{display:grid;gap:5px;margin-top:10px}
.mem{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;font-size:12.5px}
.mem .bar2{height:8px;background:var(--wash);position:relative;border:1px solid var(--rule)}
.mem .bar2::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.mem .bar2 i{position:absolute;top:0;bottom:0}
.mem .bar2 i.p{left:50%;background:var(--good)}
.mem .bar2 i.n{right:50%;background:var(--alarm)}
.textbook{font-family:var(--display);font-size:17px;line-height:1.75;font-weight:400;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;margin:0}
.decs{margin:0;padding-left:18px;font-size:14px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gcard{background:var(--sheet);border:1px solid var(--rule);padding:14px;display:grid;gap:6px;align-content:start;border-radius:2px}
.gcard .portrait{width:72px;height:90px}
.gcard .nm{font-family:var(--display);font-weight:800;font-size:16px}
.gcard .yrs{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.gcard .tt{font-family:var(--display);font-weight:800;color:var(--stamp);font-size:18px}
.gcard .chg{font-size:12px;color:var(--warn);font-family:var(--mono)}
.gcard .statue{font-size:12px;font-family:var(--mono);color:var(--muted)}
.gcard .notes{font-size:12px;color:var(--muted);margin:0;padding-left:14px}
.portrait{display:block;max-width:100%}
.logbox{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--paper);border:1px solid var(--rule);padding:10px;max-height:260px;overflow:auto;margin:8px 0}
details summary{cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.final-stage{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div id="app"></div>

<script>
'use strict';
/* ═══════════════════════ 데이터 ═══════════════════════ */
const VERSION = 1;
const SAVE_KEY = 'gukga-validation-v1';
const START_YEAR = 1968;
const TERM_CARDS = 8;
const PRESIDENTS = 3;

const FAC = ['군부','재계','서민','광장','구세력','변방'];
const FAC_GLYPH = {군부:'軍',재계:'財',서민:'民',광장:'廣',구세력:'舊',변방:'邊'};
const FAC_WHO = {

};
const STATS = [['min','민심'],['eco','경제'],['intl','국제신뢰도'],['cor','부패도']];

const HEAD = {

  재계:['그룹 세 곳이 투자 계획을 보류했다.','회장단이 오찬 초청에 전원 참석했다.'],

  광장:['대학가에 대자보가 붙기 시작했다.','신문 사설이 처음으로 ‘용기’라는 단어를 썼다.'],
  구세력:['대주교가 성탄 미사 초청을 취소했다.','지방 유지들이 기념비 모금을 시작했다.'],
  변방:['북부 도로에 검문소가 생겼다. 반군의 것이었다.','산악 마을 학교에 대통령 사진이 걸렸다.'],
};
const SUMMON = {
  군부:n=>`“${n}은 장교들을 이렇게 대하지 않았다.”`,
  재계:n=>`회장단 오찬에서 ${n} 시절 이야기가 나왔다.`,

  변방:n=>`북부 마을 회관에 ${n}의 사진이 다시 걸렸다.`,

    elec:null,lunch:null,rigged:null,elecMod:0,elecWin:false,conceded:false,transition:null};

function stageCheck(){
  while(G.stage>0){const r=STAGE_REQ[G.stage-1];if(catCount(r.cat)<r.need){G.stage--;headline(`${r.cat} 기반이 무너졌다. 나라가 ${STAGES[G.stage]} 단계로 물러났다.`);}else break;}
  if(G.stage<3){const r=STAGE_REQ[G.stage];if(catCount(r.cat)>=r.need&&G.st.eco>=r.eco&&(r.cor==null||G.st.cor<=r.cor)){G.stage++;headline(`나라가 ${STAGES[G.stage]} 단계에 들어섰다.`);}}
}

function checkCollapse(){
  if(G.st.eco<=0)return '국가 부도';
  if(G.st.min<=0)return '혁명';
  if(G.st.intl<=0)return '국제 고립';
  if(G.st.cor>=100)return '포획된 국가';
  return null;
}

function eligible(id){const d=C[id];if(!d)return false;if(G.cur.used.includes(id))return false;return !d.cond||d.cond();}

function generalPick(){
  const p=G.cur,l2=p.spk.slice(-2),ban=(l2.length===2&&l2[0]===l2[1])?l2[0]:null;
  let pool=Object.keys(C).filter(id=>C[id].pool&&eligible(id)&&C[id].spk!==ban);
  if(!pool.length)pool=Object.keys(C).filter(id=>C[id].filler);
  const w=pool.map(id=>{const d=C[id],sf=SPK[d.spk]&&SPK[d.spk].f;const s=sf?fstate(G.cur.fac[sf]):'관망';const scandal=id==='jangwan'&&G.st.cor>=70?2.5:1;return (d.w||1)*scandal*(1+(s==='적대'?1.5:s==='불만'?0.75:0));});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];
}

function draw(){
  const p=G.cur,slot=p.slot,left=TERM_CARDS+1-slot,owe=2-p.budgets;
  let id=null,prm=null;
  if(G.st.eco<=20&&eligible('imf'))id='imf';
  else if(slot===1&&p.first){id=p.first;p.first=null;}
  else if(owe>0&&owe>=left)id='budget';
  if(!id){
    G.queue.sort((a,b)=>a.due-b.due);
    for(let k=0;k<G.queue.length;k++){
      const it=G.queue[k];if(it.due>G.turn)break;const d=C[it.id];
      if(!d||(d.cond&&!d.cond())){G.queue.splice(k,1);k--;continue;}
      if(p.used.includes(it.id))continue;
      if(d.type==='청구서'&&p.bills>=4)continue;
      id=it.id;prm=it.prm;G.queue.splice(k,1);break;
    }
  }
  if(!id&&slot>=2&&p.legacy<2){const c=['lunchcut','statue'].filter(eligible);if(c.length&&Math.random()<0.5)id=pick(c);}
  if(!id&&p.budgets<(slot>=6?2:slot>=2?1:0))id='budget';
  if(!id&&slot>=7&&eligible('freelunch')&&(slot===TERM_CARDS||Math.random()<0.5))id='freelunch';
  if(!id)id=generalPick();
  if(id==='budget'&&p.lunchFund){id='lunchfund';p.lunchFund=false;}
  showCard(id,prm);
}

function showCard(id,prm){
  const d=C[id];
  if(!prm&&d.prm)prm=d.prm();
  G.card={id,prm:prm||{},heads:[]};
  G._heads=G.card.heads;if(d.onShow)d.onShow();G._heads=null;
  G.result=null;G.phase='play';
  render();
}

function extremes(){
  const out=[],f=G.cur.fac;
  if(f.재계<=-60){st({eco:-2});out.push('자본 탈출 · 경제 -2');}
  if(f.서민<=-60){st({min:-3});out.push('폭동 · 민심 -3');}
  if(f.광장<=-60){st({intl:-2});out.push('외신 비판 · 국제신뢰도 -2');}
  if(f.광장>=60){st({cor:1});out.push('언론이 실수를 덮는다 · 부패도 +1');}
  return out;
}

function choose(side){
  if(!G.card||G.result)return;
  const d=C[G.card.id],card=d.make(G.card.prm),o=card[side],p=G.cur;
  const st0={...G.st},fac0={...p.fac};
  G._heads=[];
  ACC={st:{},fac:{}};
  st(o.st||{});fac(effFac(o));
  let txt=o.run?o.run(st0):undefined;if(!txt)txt=o.res||'';
  commit();
  if(o.flag)setFlag(o.flag);
  if(d.type==='청구서')p.bills++;
  if(d.legacy)p.legacy++;
  if(d.done)d.done();
  const isTerm=G.mode==='term';
  if(isTerm){p.used.push(G.card.id);p.spk.push(d.spk);}
  const ext=isTerm?extremes():[];
  if(isFog())G.fog=clamp(G.fog+R(-3,3),-10,10);
  else if(G.fog){headline(`통계청이 수정치를 발표했다. 경제 실제 지수 ${G.st.eco}.`);G.fog=0;}
  const w=FAC.reduce((s,f)=>s+Math.abs(p.fac[f]-fac0[f]),0);
  cp().decisions.push({rep:o.rep||card.title,flag:o.flag||null,w,hist:o.hist||null,h:G.half});
  for(const f of FAC){
    const s0=fstate(fac0[f]),s1=fstate(p.fac[f]);
    if(s0!==s1){headline(HEAD[f][STATE_LV[s1]>STATE_LV[s0]?1:0]);if(s1==='적대')summon(f);}
  }
  stageCheck();
  G.turn++;if(isTerm){G.half++;p.slot++;}
  const col=checkCollapse();
  if(col&&!G.pendingEnd){G.pendingEnd=col;headline(COLLAPSE_HEAD[col]);}
  const ch=[];
  for(const [k,n] of STATS){const dv=G.st[k]-st0[k];if(dv)ch.push({n,d:dv,good:k==='cor'?dv<0:dv>0});}
  const fch=FAC.filter(f=>p.fac[f]!==fac0[f]).map(f=>({f,d:p.fac[f]-fac0[f],s0:fstate(fac0[f]),s1:fstate(p.fac[f])}));
  G.result={side,title:card.title,label:o.label,txt,ch,fch,ext,heads:G._heads,col:G.pendingEnd};
  G._heads=null;
  render();
}

function summon(f){
  let best=null,bv=19;
  G.pres.forEach((P,i)=>{if(i<ci()&&P.mem&&P.mem[f]>bv){bv=P.mem[f];best=i;}});
  if(best!=null)headline(SUMMON[f](pn(best)));
}

function next(){
  if(!G.result)return;
  if(G.mode==='count'){showPress();return;}
  if(G.mode==='press'){finishPresidency();return;}
  if(G.pendingEnd){showPress();return;}
  if(G.cur.slot>TERM_CARDS){startElection();return;}
  draw();
}

function termEnd(){
  const L=[];ACC={st:{},fac:{}};
  const add=(why,s,f)=>{st(s||{});fac(f||{});const parts=[...Object.entries(s||{}).map(([k,v])=>`${SN[k]} ${v>0?'+':''}${v}`),...Object.entries(f||{}).map(([k,v])=>`${k} ${v>0?'+':''}${v}`)];L.push([why,parts.join(', ')]);};
  if(hasBase('치안'))add('치안 회복',{min:3});
  if(hasBase('항구'))add('항구',{eco:2,intl:2});
  if(hasBase('제철소'))add('제철소',{eco:3},{재계:5});
  if(hasBase('공단'))add('수출 공단',{eco:4,intl:2});
  if(hasBase('법원'))add('독립 법원',{cor:-3});
  if(hasBase('국립대학')&&ci()-G.bases.국립대학.term>=3)add('국립대학',{eco:3},{광장:5});
  if(hasBase('급식'))add('학교 급식',null,{서민:5});
  commit();
  if(has('급식')&&G.half-G.flags.급식.h>=16)addBase('급식',G.flags.급식.o);
  return L;
}

function startElection(){
  G._heads=[];
  const lines=termEnd();
  const heads=G._heads;G._heads=null;
  stageCheck();
  const col=checkCollapse();
  if(col){G.pendingEnd=col;headline(COLLAPSE_HEAD[col]);}
  const opp=pick([['분열',10],['보통',0],['보통',0],['단일화',-10]]);
  const fz=G.cur.fac.재계;
  const parts=[['민심',G.st.min],[`야권 ${opp[0]}`,opp[1]],['재계 자금',fz>=20?5:fz<=-60?-5:0]];
  if(G.elecMod)parts.push(['무상 급식 공약',G.elecMod]);
  const score=parts.reduce((s,x)=>s+x[1],0);
  G.elec={lines,heads,parts,score,final:score+R(-3,3)};
  G.phase='election';
  render();
}
function beginCount(){
  if(G.pendingEnd){showPress();return;}
  G.mode='count';showCard('count',{score:G.elec.score,final:G.elec.final});
}
function showPress(){
  G.mode='press';
  const ds=[...cp().decisions].sort((a,b)=>b.w-a.w);
  const hit=ds.find(d=>d.flag&&QUESTIONS[d.flag]);
  showCard('press',{k:hit?hit.flag:'_'});
}

function titleOf(P){
  const m=P.mem;if(!m)return {main:null,titles:[]};
  const titles=[];
  FAC.forEach(f=>{if(m[f]>=50)titles.push([f,TITLES[f][0],m[f]]);else if(m[f]<=-50)titles.push([f,TITLES[f][1],m[f]]);});
  const col=COLLAPSE.includes(P.end);
  let main=null;
  if(col&&m.광장>=50&&m.서민>=50)main='순교자';
  else if(m.군부>=50&&m.재계>=50&&m.광장<=-50)main='개발 독재';
  else if(m.서민>=50&&m.광장<=-50)main='사랑받은 독재자';
  else if(m.광장>=50&&m.서민<=-50)main='박수받은 엘리트';
  else if(FAC.every(f=>m[f]<=-30))main='모두가 미워한 사람';
  else if(FAC.every(f=>Math.abs(m[f])<=30))main='그냥 그런 대통령';
  else if(titles.length)main=[...titles].sort((a,b)=>Math.abs(b[2])-Math.abs(a[2]))[0][1];
  return {main,titles};
}
function histLine(P){
  const hs=P.decisions.filter(d=>d.hist).sort((a,b)=>b.w-a.w).slice(0,2).sort((a,b)=>a.h-b.h).map(d=>d.hist);
  if(COLLAPSE.includes(P.end))hs.push(`${P.end}로 물러났다`);
  if(!hs.length)return null;
  return hs.map((h,i)=>i<hs.length-1?h.replace(/다$/,'고'):h).join(', ')+'.';
}

function finishPresidency(){
  const P=cp();
  P.end=G.pendingEnd||(G.elecWin?'임기 만료':'선거 패배');
  P.h1=G.half;
  P.mem={...G.cur.fac};
  if(G.conceded){P.mem.광장=clamp(P.mem.광장+20,-100,100);P.notes.push('패배 인정 · 광장 +20');}
  G.pres.forEach((Q,i)=>{if(i<ci()&&Q.mem)FAC.forEach(f=>{Q.mem[f]=Math.round(Q.mem[f]*0.8);});});
  P.top=[...P.decisions].filter(d=>d.rep!=='퇴임 회견').sort((a,b)=>b.w-a.w).slice(0,3).map(d=>d.rep);
  P.line=histLine(P);
  if(G.pendingEnd)G.collapses++;else G.collapses=0;
  G.card=null;G.result=null;
  G.phase='legacy';
  render();
}

function failed(){return G.collapses>=3||['곡물','치안','통화'].every(k=>!hasBase(k));}

function toGallery(){G.phase='gallery';render();}
function afterGallery(){
  G.pres.forEach(P=>{P.shown=titleOf(P).main||'—';});
  if(G.pres.length>=PRESIDENTS||failed()){G.phase='final';render();return;}
  prepTransition();G.phase='name';render();
}

function prepTransition(){
  const prev=G.pres[G.pres.length-1];
  const T={end:prev?prev.end:null,lines:[]};
  if(!prev){G.transition=T;return;}
  const map={
    '임기 만료':['즉시 변화 없음','새 대통령의 세력은 모두 관망에서 시작','첫 카드: [계승]'],
    '선거 패배':['즉시 변화 없음','새 대통령의 세력은 모두 관망에서 시작','첫 카드: [계승]'],
    '국가 부도':['경제 15로, 통화 안정 기반 상실','재계 불만에서 시작','첫 카드: [IMF] 강제'],
    '혁명':['민심 60으로, 경제 -15','광장·서민 호의, 재계 적대에서 시작'],
    '국제 고립':['국제신뢰도 10으로','구세력 호의에서 시작'],
    '포획된 국가':['부패도 80으로','재계 열광, 광장 적대에서 시작'],
  };
  T.lines=map[prev.end]||[];
  G.transition=T;
}

function startPresidency(name,gender){
  const prev=G.pres[G.pres.length-1];
  G.pres.push({name,g:gender,h0:G.half,decisions:[],built:[],notes:[],statue:null});
  const fac0=prev?up(FAC,0):{...ARANDO_FAC};
  let first=null,lunchFund=false;
  G._heads=[];
  G.cur={fac:fac0,slot:1,used:[],budgets:0,bills:0,legacy:0,first:null,spk:[],lunchFund:false};
  if(prev){
    switch(prev.end){
      case '임기 만료':case '선거 패배':first='succession';break;
      case '국가 부도':G.st.eco=15;if(hasBase('통화'))loseBase('통화','외환 보유고가 바닥났다.');fac0.재계=-40;first='imf';revealFraud();break;
      case '혁명':G.st.min=60;G.st.eco=clamp(G.st.eco-15,0,100);if(G.st.eco<=0)G.st.eco=5;fac0.광장=30;fac0.서민=30;fac0.재계=-70;revealFraud();break;
      case '국제 고립':G.st.intl=10;fac0.구세력=30;revealFraud();break;
      case '포획된 국가':G.st.cor=80;fac0.재계=70;fac0.광장=-70;revealFraud();break;
    }
    if(G.rigged==='caught'&&has('개표_조작')){
      const o=G.flags.개표_조작.o;st({intl:-15,min:-10});mem(o,'광장',-20,'개표 원본 공개');mem(o,'서민',-10,'개표 원본 공개');
      headline(`선관위가 없던 ${yearOf(G.flags.개표_조작.h)}년의 개표 원본이 공개됐다. 세 개 주의 숫자가 달랐다.`);unflag('개표_조작');
    }
    if(G.lunch==='ours'||(G.lunch==='theirs'&&prev.end==='선거 패배'))lunchFund=true;
    else unflag('급식_공약');
  }
  G.cur.first=first;G.cur.lunchFund=lunchFund;
  G.lunch=null;G.elecMod=0;G.elecWin=false;G.conceded=false;G.pendingEnd=null;G.mode='term';G.rigged=G.rigged==='hidden'?'hidden':null;G.elec=null;
  const add=(id,a,b)=>G.queue.push({id,due:G.turn+R(a,b),prm:null});
  if(has('제철소_독점')&&!has('노조_인정')&&Math.random()<0.6)add('union',1,5);
  if(has('봉제공장')){let pr=10+G.st.cor/2;if(hasBase('노동감독청'))pr/=2;if(Math.random()*100<pr)add('accident',1,6);}
  if(has('비상조치')&&Math.random()<0.5)add('wrongful',1,6);
  if(has('조용한_퇴장')&&G.flags.조용한_퇴장.o!==ci())add('account',1,4);
  if(has('긴축')&&Math.random()<0.4)add('fuel',1,6);
  stageCheck();
  const startHeads=G._heads;G._heads=null;
  draw();
  if(G.card)G.card.heads=[...startHeads,...G.card.heads];
  render();
}

function ledgerHTML(){
  const steps=STAGES.map((s,i)=>`<span class="${i===G.stage?'on':i<G.stage?'done':''}">${s}</span>`).join('');
  let req='';
  if(G.stage<3){const r=STAGE_REQ[G.stage];req=`다음 단계: ${r.cat} 기반 ${catCount(r.cat)}/${CAT_TOTAL[r.cat]} (필요 ${r.need}) · 경제 ${r.eco}↑${r.cor?` · 부패도 ${r.cor}↓`:''}`;}
  const bl=Object.keys(G.bases).filter(k=>BASES[k]).map(k=>{const b=G.bases[k];return `<li title="${esc(BASES[k].fx)}"><span><span class="cat">${BASES[k].cat}</span>${BASES[k].n}</span><span class="own">${b.o!=null&&G.pres[b.o]?`${ord(b.o)} ${esc(G.pres[b.o].name)}`:'이전 정부'}</span></li>`;}).join('');
  const pl=Object.keys(G.prog).map(k=>`<li class="prog"><span><span class="cat">공사</span>${BASES[k].n}</span><span class="own">${G.prog[k]}/2</span></li>`).join('');
  const FL={창고_봉쇄:'창고 봉쇄',조용한_퇴장:'장관의 조용한 퇴장',긴축:'IMF 긴축',지불유예:'지불 유예',비상조치:'비상조치',법대로:'법대로',제철소_독점:'제철소 독점',봉제공장:'12시간 근무',급식_공약:'급식 공약',급식:'무상 급식',노조_인정:'제철소 노조'};
  const fl=Object.keys(G.flags).filter(k=>FL[k]).map(k=>`<span>${FL[k]}</span>`).join('');
  const prev=G.pres.slice(0,-1).map((P,i)=>{const t=titleOf(P).main;return `<li>${portrait(i)}<div><div class="t">${ord(i)} ${esc(P.name)}</div><div class="s">${t?esc(t):'그런 대통령도 있었지.'}</div></div></li>`;}).join('');
  return `<section class="ledger"><div class="panel"><h3>나라</h3><div class="stage-line">${STAGES[G.stage]} 단계</div><div class="stage-steps">${steps}</div><div class="next-req">${req}</div><ul class="bases">${bl}${pl}</ul>${fl?`<div class="flags" title="나라에 남은 결정들">${fl}</div>`:''}</div>${prev?`<div class="panel"><h3>역대 대통령</h3><ul class="prez">${prev}</ul></div>`:''}</section>`;
}
function wireHTML(){
  const items=G.news.slice(0,3);
  if(!items.length)return `<div class="wire" aria-live="polite"><span class="empty">헤드라인 없음. 세력의 태도가 바뀌면 여기에 뜬다.</span></div>`;
  return `<div class="wire" aria-live="polite">${items.map(n=>`<p><span class="d">${n.t}</span><span>${esc(n.h)}</span></p>`).join('')}</div>`;
}
function speakerHTML(name,line){
  const s=SPK[name]||{g:'?'};const mood=s.m||MOOD[s.f?fstate(G.cur.fac[s.f]):'관망'];
  const recs=(G.records[name]||[]).slice(-2);
  return `<div class="speaker"><div class="sg">${s.g}</div><div><div class="who"><b>${name}</b> <i>(${mood})</i></div><blockquote>“${esc(line)}”</blockquote>${recs.length?`<div class="rec">${recs.map(r=>`<span>기록: ${esc(r)}</span>`).join('')}</div>`:''}</div></div>`;
}
function cardHTML(){
  const d=C[G.card.id],c=d.make(G.card.prm);
  const speakers=c.dual?c.dual.map(([n,l])=>speakerHTML(n,l)).join(''):speakerHTML(d.spk,c.line);
  const opt=(side,o)=>`<button class="opt" data-side="${side}" id="opt-${side}"><span class="k">${side==='L'?'← 왼쪽':'오른쪽 →'}</span><span class="lab">${esc(o.label)}</span><span class="fxs">${fxHTML(o)}</span></button>`;
  return `<article class="memo"><div class="memo-head"><span class="lbl">대통령 비서실 · 보고 No. ${String(G.turn+1).padStart(4,'0')}</span><span class="stamp">${d.type}</span></div><h2>${esc(c.title)}</h2><p class="sit"><b>상황</b>${esc(c.sit)}</p>${speakers}<div class="choices">${opt('L',c.L)}${opt('R',c.R)}</div></article>`;
}
function resultHTML(){
  const r=G.result,d=C[G.card.id];
  const ch=r.ch.map(x=>`<li class="${x.good?'g':'b'}">${x.n} <b>${x.d>0?'+':''}${x.d}</b></li>`).join('')+r.fch.map(x=>`<li class="${x.d>0?'g':'b'}">${x.f} <b>${arrows(x.d,10)}</b>${x.s0!==x.s1?` ${x.s0} → ${x.s1}`:''}</li>`).join('');
  const nextLbl=G.mode==='press'?'유산 기록으로':(G.mode==='count'?'마지막 기자회견':(r.col?'퇴임':(G.cur.slot>TERM_CARDS?'임기 정산과 선거':'다음 보고')));
  return `<article class="memo result"><div class="memo-head"><span class="lbl">${esc(r.title)} · 처리 완료</span><span class="stamp">${d.type}</span></div><div class="chosen"><span class="big-stamp">裁可</span><span class="lab">${esc(r.label)}</span></div><p class="txt">${esc(r.txt)}</p>${ch?`<ul class="changes">${ch}</ul>`:''}${r.ext.length?`<p class="ext">세력 압력: ${r.ext.map(esc).join(' / ')}</p>`:''}${r.heads.length?`<div class="heads">${r.heads.map(h=>`<p>${esc(h)}</p>`).join('')}</div>`:''}${r.col&&G.mode==='term'?`<p class="collapse-note">몰락: ${r.col}. 대통령은 여기서 끝난다. 나라는 다음 대통령에게 넘어간다.</p>`:''}<div class="nextrow"><button class="btn" id="next">${nextLbl} →</button></div></article>`;
}
function electionHTML(){
  const e=G.elec;
  const tl=e.lines.length?`<table class="tbl">${e.lines.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>`:'<p>정산할 기반 효과가 없다.</p>';
  const sc=`<table class="tbl">${e.parts.map(([a,b])=>`<tr><td>${a}</td><td>${b>0&&a!=='민심'?'+':''}${b}</td></tr>`).join('')}<tr class="sum"><td>선거 점수 (50 이상이면 여당 승리)</td><td>${e.score}</td></tr></table>`;
  return `<article class="memo"><div class="memo-head"><span class="lbl">임기 4년 · ${dateLabel()}</span><span class="stamp">선거</span></div><h2>임기 정산</h2><p class="sit"><b>기반</b>나라에 남은 것들이 이번 임기의 몫을 냈다.</p>${tl}${e.heads.length?`<div class="heads">${e.heads.map(h=>`<p>${esc(h)}</p>`).join('')}</div>`:''}<h2 style="margin-top:18px">선거</h2><p class="sit"><b>규칙</b>검증판에는 재선이 없다. 여당 후보가 이기면 임기 만료, 지면 선거 패배로 기록된다. 선관위가 없어 개표는 내무부가 한다.</p>${sc}<div class="nextrow"><button class="btn" id="tocount">${G.pendingEnd?'퇴임':'개표 상황실로'} →</button></div></article>`;
}
function playHTML(){
  let main;
  if(G.phase==='election')main=electionHTML();
  else if(G.result)main=resultHTML();
  else{const hs=G.card.heads||[];main=(hs.length?`<div class="heads">${hs.map(h=>`<p>${esc(h)}</p>`).join('')}</div>`:'')+cardHTML();}
  return headerHTML()+`<div class="desk">${vitalsHTML()}<main class="main">${wireHTML()}${main}</main>${ledgerHTML()}</div>`;
}

function titleHTML(){
  const s=loadSave();const canCont=s&&!['title','final'].includes(s.phase);
  return `<div class="screen"><div class="title-hero"><div class="hanja">國家</div><div class="ko">국 가</div><p class="thesis">대통령은 길어야 8년. 나라는 남는다.</p></div>
  <ul class="howto"><li>대통령을 차례로 맡아 한 나라를 이어 간다. 결재 서류마다 둘 중 하나를 고른다.</li><li>지표는 숫자로, 세력은 단어로만 보인다. 부패가 심하면 경제 수치마저 흐려진다.</li><li>한 대통령의 결정은 다음 대통령의 현실이 되고, 사람들의 기억은 짐이 되거나 무기가 된다.</li></ul>
  <p class="build-note">검증판 · 아란도 공화국(산업화 단계에서 시작) · 대통령 세 명 · 임기당 결재 여덟 장 · 키보드 ← → 로도 고를 수 있다.</p>
  <div class="row"><button class="btn" id="newgame">새 나라 시작</button>${canCont?'<button class="btn ghost" id="cont">이어 하기</button>':''}</div></div>`;
}
function nameHTML(){
  const idx=G.pres.length;const T=G.transition||{lines:[]};const prev=G.pres[idx-1];
  const g0=pick(['남','여']);
  const intro=idx===0?`<div class="notice"><b>아란도 공화국</b><span>한때 대륙의 곡창지대였으나 포퓰리즘 정권이 수십 년간 이어지며 만성 재정 적자에 시달리는 나라. 국민들은 “예전엔 잘 살았는데”를 입버릇처럼 달고 산다.</span><ul><li>민심 55 · 경제 35 · 국제신뢰도 45 · 부패도 60</li><li>산업화 단계 (간신히) · 기반: 곡물 비축망, 치안 회복, 항구</li><li>서민·구세력 호의, 나머지 관망</li></ul></div>`
    :`<div class="notice"><b>교체 방식: ${esc(prev.end)}</b><ul>${T.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
  return `<div class="screen"><div><span class="lbl">${dateLabel()} · 취임 선서</span><h1 style="font-size:clamp(30px,6vw,44px)">${ord(idx)} 대통령</h1></div>${intro}
  <form class="sheet" id="nameform" style="display:grid;gap:14px"><div class="field"><label class="lbl" for="pname">이름</label><input type="text" id="pname" maxlength="16" value="${esc(pick(NAMES[g0]))}" autocomplete="off"></div>
  <div class="field"><span class="lbl">성별</span><div class="gender"><label><input type="radio" name="pg" id="pg-m" value="남" ${g0==='남'?'checked':''}><span>남</span></label><label><input type="radio" name="pg" id="pg-f" value="여" ${g0==='여'?'checked':''}><span>여</span></label></div></div>
  <div class="row"><button type="submit" class="btn">취임</button><button type="button" class="btn ghost" id="rname">무작위</button></div></form></div>`;
}
function memBars(m){return `<div class="memgrid">${FAC.map(f=>{const v=m[f];const w=Math.abs(v)/2;return `<div class="mem"><span>${f}</span><span class="bar2"><i class="${v>=0?'p':'n'}" style="width:${w}%"></i></span></div>`;}).join('')}</div>`;}
function legacyHTML(){
  const i=ci(),P=G.pres[i],t=titleOf(P);
  const built=P.built.map(k=>BASES[k].n);
  return `<div class="screen"><span class="lbl">유산 카드 · ${yearOf(P.h0)}–${yearOf(P.h1)}</span><div class="sheet legacy">${portrait(i)}<div style="min-width:0;display:grid;gap:10px">
  <div><h1 style="font-size:clamp(24px,4.4vw,32px)">${ord(i)} 대통령 ${esc(P.name)}</h1><span class="lbl">끝난 방식 · ${esc(P.end)}</span></div>
  <div><div class="ttl-main">${t.main?esc(t.main):'그런 대통령도 있었지.'}</div>${t.titles.length?`<div class="ttl-sub">${t.titles.map(([f,n])=>`<span><b>${f}</b>${n}</span>`).join('')}</div>`:''}</div>
  <div><span class="lbl">세력별 기억 · 퇴임 순간의 태도</span>${memBars(P.mem)}</div>
  ${P.top.length?`<div><span class="lbl">대표 결정</span><ol class="decs">${P.top.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>`:''}
  <div><span class="lbl">만든 기반</span><p style="margin:2px 0 0">${built.length?built.map(esc).join(', '):'없음'}</p></div>
  ${P.line?`<p class="textbook">교과서: ${ord(i)} 대통령 ${esc(P.name)}은 ${esc(P.line)}</p>`:''}
  </div></div><p class="build-note">기억은 고정되지 않는다. 대통령이 바뀔 때마다 흐려지고(×0.8), 나중의 사건이 다시 쓴다.</p><div class="row"><button class="btn" id="togallery">역대 대통령 →</button></div></div>`;
}
function galleryCards(){
  return G.pres.map((P,i)=>{const t=titleOf(P),now=t.main||'—';
    const chg=P.shown&&P.shown!==now?`<div class="chg">칭호 변경: ${esc(P.shown)} → ${esc(now)}</div>`:'';
    const stt=P.statue?`<div class="statue">동상: ${P.statue==='removed'?'철거됨':'서 있음'}${P.removed?` · 철거 ${P.removed}회`:''}${P.rebuilt?` · 재건립 ${P.rebuilt}회`:''}</div>`:'';
    return `<div class="gcard">${portrait(i)}<div class="nm">${ord(i)} ${esc(P.name)}</div><div class="yrs">${yearOf(P.h0)}–${yearOf(P.h1)} · ${esc(P.end)}</div><div class="tt">${t.main?esc(t.main):'그런 대통령도 있었지.'}</div>${t.titles.length?`<div class="ttl-sub">${t.titles.map(([f,n])=>`<span><b>${f}</b>${n}</span>`).join('')}</div>`:''}${chg}${stt}${memBars(P.mem)}${P.notes.length?`<ul class="notes">${P.notes.slice(-3).map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}</div>`;}).join('');
}
function galleryHTML(){
  const last=G.pres.length>=PRESIDENTS||failed();
  return `<div class="screen" style="max-width:1000px"><div><span class="lbl">${dateLabel()} · 초상화 복도</span><h1 style="font-size:clamp(28px,5vw,40px)">역대 대통령</h1></div><p class="build-note">칭호는 지금의 기억으로 붙는다. 재평가가 일어나면 바뀐다.</p><div class="gallery">${galleryCards()}</div><div class="row"><button class="btn" id="aftergallery">${last?'나라의 기록':'다음 대통령 취임'} →</button></div></div>`;
}
function countryText(){
  const s=['아란도 공화국.'];
  G.pres.forEach((P,i)=>{if(P.line)s.push(`${ord(i)} 때 ${P.line}`);});
  G.pres.forEach((P,i)=>{if(P.removed||P.rebuilt){const a=[];if(P.removed)a.push(`${P.removed===1?'한':'두'} 번 철거되고`);if(P.rebuilt)a.push(`${P.rebuilt===1?'한':'두'} 번 다시 섰다`);else a[a.length-1]=a[a.length-1].replace(/되고$/,'됐다');s.push(`${ord(i)} 대통령의 동상은 ${a.join(' ')}.`);}});
  if(has('분식'))s.push(`${yearOf(G.flags.분식.h)}년의 성장률 6%는 끝내 정정되지 않았다.`);
  if(has('개표_조작'))s.push(`${yearOf(G.flags.개표_조작.h)}년 세 개 주의 개표 원본은 아직 공개되지 않았다.`);
  if(has('급식'))s.push(`무상 급식은 ${Math.floor((G.half-G.flags.급식.h)/2)}년째 이어지고 있다.`);
  if(failed())s.push('그리고 나라는 더 버티지 못했다.');
  else s.push(`${yearOf(G.half)}년, 나라는 ${STAGES[G.stage]} 단계에 있었다.`);
  return s.join(' ');
}
function logText(){
  const L=[`국가 검증판 · 아란도 공화국 · ${START_YEAR}–${yearOf(G.half)}`,`최종: ${failed()?'실패 국가':STAGES[G.stage]+' 단계 ('+STAGE_NICK[G.stage]+')'} · 민심 ${G.st.min} 경제 ${G.st.eco} 국제 ${G.st.intl} 부패 ${G.st.cor}`,`기반: ${Object.keys(G.bases).filter(k=>BASES[k]).map(k=>BASES[k].n).join(', ')}`,''];
  G.pres.forEach((P,i)=>{const t=titleOf(P);L.push(`${ord(i)} ${P.name} (${yearOf(P.h0)}–${yearOf(P.h1)}, ${P.end})`);L.push(`  칭호: ${t.main||'없음'}${t.titles.length?' | '+t.titles.map(x=>x[0]+': '+x[1]).join(', '):''}`);L.push(`  기억: ${FAC.map(f=>f+' '+P.mem[f]).join(' / ')}`);L.push(`  대표 결정: ${P.top.join(', ')||'없음'}`);if(P.notes.length)L.push(`  재평가: ${P.notes.join(' / ')}`);});
  L.push('',`칭호 조합: ${G.pres.map(P=>titleOf(P).main||'—').join(' · ')}`);
  return L.join('\n');
}
function finalHTML(){
  const nick=failed()?'실패 국가':STAGE_NICK[G.stage];
  return `<div class="screen" style="max-width:1000px"><div><span class="lbl">${START_YEAR}–${yearOf(G.half)} · 나라의 끝</span><div class="final-stage">${nick}</div></div>
  <p class="textbook">${esc(countryText())}</p><div class="gallery">${galleryCards()}</div>
  <details><summary>검증 기록 (플레이테스트용)</summary><pre class="logbox" id="logbox">${esc(logText())}</pre><button class="btn ghost" id="copylog">기록 복사</button></details>
  <div class="row"><button class="btn" id="restart">새 나라 시작</button></div></div>`;
}

function render(){
  if(!HAS_DOM)return;
  save();
  const ph=G.phase;
  let h='';
  if(ph==='title')h=titleHTML();
  else if(ph==='name')h=nameHTML();
  else if(ph==='play'||ph==='election')h=playHTML();
  else if(ph==='legacy')h=legacyHTML();
  else if(ph==='gallery')h=galleryHTML();
  else if(ph==='final')h=finalHTML();
  $app.innerHTML=h;
  bind();
  const f=document.getElementById('next')||document.getElementById('opt-L');
  if(f&&document.activeElement===document.body)try{f.focus({preventScroll:true});}catch(e){}
}
function bind(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',fn);};
  on('newgame',()=>{clearSave();G=fresh();prepTransition();G.phase='name';render();});
  on('cont',()=>{const s=loadSave();if(s){G=s;render();}});
  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.side)));
  on('next',()=>{next();window.scrollTo({top:0});});
  on('tocount',()=>{beginCount();});
  on('togallery',()=>{toGallery();window.scrollTo({top:0});});
  on('aftergallery',()=>{afterGallery();window.scrollTo({top:0});});
  on('restart',()=>{clearSave();G=fresh();render();});
  on('rname',()=>{const g=document.querySelector('input[name=pg]:checked');const v=g?g.value:'남';document.getElementById('pname').value=pick(NAMES[v]);});
  document.querySelectorAll('input[name=pg]').forEach(r=>r.addEventListener('change',()=>{document.getElementById('pname').value=pick(NAMES[r.value]);}));
  const form=document.getElementById('nameform');
  if(form)form.addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('pname').value.trim()||pick(NAMES.남);const g=(document.querySelector('input[name=pg]:checked')||{}).value||'남';startPresidency(n,g);window.scrollTo({top:0});});
  on('copylog',()=>{const t=logText();const box=document.getElementById('logbox');const sel=()=>{const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);};
    try{navigator.clipboard.writeText(t).then(()=>{document.getElementById('copylog').textContent='복사됨';},sel);}catch(e){sel();}});
}
if(HAS_DOM){
  document.addEventListener('keydown',e=>{
    if(!G||e.target.tagName==='INPUT')return;
    if(G.phase==='play'&&!G.result){if(e.key==='ArrowLeft'){e.preventDefault();choose('L');}else if(e.key==='ArrowRight'){e.preventDefault();choose('R');}}
  });
  const start=(data)=>{G=(data&&data.G&&data.G.v===VERSION)?data.G:fresh();render();};
  try{window.claude?.hot?.snapshot?.(()=>({G}));}catch(e){}
  window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
